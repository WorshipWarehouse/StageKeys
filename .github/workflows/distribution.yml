name: Release regression gates
# One run per commit. A branch push used to start a second, identical run
# alongside the pull_request one, which doubled macOS runner load and reported
# two check runs with the same required name for the same commit (GitHub treats
# duplicate names as ambiguous). main is still verified on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  builds:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [mac, simulator]
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: xcodebuild -version && swift --version
      - name: Build and validate library-free artifact
        run: Tools/verify-release.sh ${{ matrix.platform }} "$RUNNER_TEMP/stagekeys-build"
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/stagekeys-build/*.log
          retention-days: 14
  processing:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parser corpus
        run: |
          python3 Tests/test-preset-coverage.py
          for check in Tests/test-audit-mainstage-presets.py Tests/test-app-icon.py Tests/test-pack-document-type.py Tests/test-local-library-runner.py Tests/test-catalog-tags.py Tests/test-distribution.py Tests/test-sampler-calibration.py; do
            if [[ -f "$check" ]]; then python3 "$check"; fi
          done
      - name: Reverb memory and undefined-behavior regressions
        run: Tests/test-reverb.sh
  library:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Portable conversion, persistence, host and routing regressions
        run: python3 Tests/run-local-library.py . "$RUNNER_TEMP/stagekeys-library" ExternalGraphTailTests
      - name: Preserve test outcomes and explicit fixture skips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-results
          path: |
            ${{ runner.temp }}/stagekeys-library/results.json
            ${{ runner.temp }}/stagekeys-library/summary.md
          retention-days: 14
