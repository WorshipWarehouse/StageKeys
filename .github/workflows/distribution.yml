name: Release regression gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  builds:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [mac, simulator]
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: xcodebuild -version && swift --version
      - name: Build and validate library-free artifact
        run: Tools/verify-release.sh ${{ matrix.platform }} "$RUNNER_TEMP/stagekeys-build"
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/stagekeys-build/*.log
          retention-days: 14
  processing:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parser corpus
        run: python3 Tests/test-preset-coverage.py
      - name: Reverb memory and undefined-behavior regressions
        run: Tests/test-reverb.sh
  library:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Portable conversion, persistence, host and routing regressions
        run: Tests/test-library.sh
