name: StageKeys
options:
  bundleIdPrefix: studio.stagekeys
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: StageKeys
    INFOPLIST_KEY_UIAppFonts: [IBMPlexSans-Regular.ttf, IBMPlexSans-SemiBold.ttf, IBMPlexSans-Bold.ttf]
    MARKETING_VERSION: 0.42.0
    CURRENT_PROJECT_VERSION: 46
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_C_LANGUAGE_STANDARD: gnu11
targets:
  StageKeysMac:
    type: application
    platform: macOS
    deploymentTarget: '13.0'
    info:
      path: Resources/Info-macOS.plist
      properties:
        CFBundleIconFile: StageKeys
    sources:
      - path: Sources
      - path: Licenses
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/StageKeys.icns
        buildPhase: resources
    settings:
      base:
        INFOPLIST_KEY_CFBundleIconFile: StageKeys
        PRODUCT_BUNDLE_IDENTIFIER: studio.stagekeys.mac
        CODE_SIGN_IDENTITY: '-'
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMIDI.framework
      - sdk: libz.tbd
  StageKeysMobile:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: Sources
      - path: Licenses
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.stagekeys.mobile
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMIDI.framework
      - sdk: libz.tbd
